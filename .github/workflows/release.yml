name: Release (macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Signing + Notarization (Optional)
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER }}
        run: |
          set -euo pipefail

          missing=()
          for k in MACOS_CERT_P12_BASE64 MACOS_CERT_P12_PASSWORD MACOS_SIGN_IDENTITY ASC_KEY_P8_BASE64 ASC_KEY_ID ASC_ISSUER; do
            if [[ -z "${!k:-}" ]]; then
              missing+=("$k")
            fi
          done

          if [[ "${#missing[@]}" -eq 6 ]]; then
            echo "Signing/Notarization: disabled (no secrets set)"
            exit 0
          fi
          if [[ "${#missing[@]}" -ne 0 ]]; then
            echo "Signing/Notarization: misconfigured. Missing: ${missing[*]}" >&2
            exit 1
          fi

          CERT_P12_PATH="$RUNNER_TEMP/cert.p12"
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          NOTARY_PROFILE="mactemp-notary"

          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_P12_PATH"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$AUTH_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security import "$CERT_P12_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          xcrun notarytool store-credentials \
            "$NOTARY_PROFILE" \
            --key "$AUTH_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER" \
            --validate

          echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "NOTARY_KEYCHAIN_PROFILE=$NOTARY_PROFILE" >> "$GITHUB_ENV"

      - name: Build + Package (zip + dmg)
        run: |
          chmod +x build.sh package.sh
          bash package.sh

      - name: Create Stable Filenames
        run: |
          set -euo pipefail
          dmg="$(ls -1 dist/release/*.dmg | head -n 1)"
          zip="$(ls -1 dist/release/*.zip | head -n 1)"
          cp "$dmg" "dist/release/MacTempMenuBar.dmg"
          cp "$zip" "dist/release/MacTempMenuBar.zip"

      - name: Upload Assets To GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/*.zip
            dist/release/*.dmg

      # Keep /releases/latest reserved for the rolling main build (tag: nightly).
      - name: Ensure Versioned Release Is Not "Latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq .id)"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -f make_latest=false
